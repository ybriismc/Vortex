name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "changelogs/**", "**/*.md"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build a loadable plugin
        run: |
          CGO_ENABLED=1 go build -o vortex ./cmd/vortex
          go build -buildmode=plugin -o plugins/greeter.so ./examples/plugins/greeter

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the native build enables cgo: cross-compiling it would need a
          # cross toolchain, which the release workflow installs.
          - { goos: linux, goarch: amd64, cgo: "1" }
          - { goos: linux, goarch: arm64, cgo: "0" }
          - { goos: windows, goarch: amd64, cgo: "0" }
          - { goos: darwin, goarch: amd64, cgo: "0" }
          - { goos: darwin, goarch: arm64, cgo: "0" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          binary=vortex
          if [ "$GOOS" = "windows" ]; then binary=vortex.exe; fi
          go build -trimpath -ldflags "-s -w -X main.version=$(git rev-parse --short HEAD)" -o "dist/$binary" ./cmd/vortex

      - uses: actions/upload-artifact@v4
        with:
          name: vortex-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
